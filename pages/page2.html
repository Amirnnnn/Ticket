<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Css/common.css" />
    <link rel="stylesheet" href="../Css/style2.css" />
    <link rel="stylesheet" href="../Css/responsive.css" />
    <title>Ticket</title>
  </head>
  <body>
    <header>
      <!-- **********  nav header  ********* -->
      <nav class="nav-bar-container">
        <div class="logo-container">
          <img src="../assets/images/logo-mark.svg" alt="logo-mark" />
          <h2>Coding Conf</h2>
        </div>
      </nav>
    </header>

    <main class="main-container">
      <!-- **********  main head  ********* -->
      <div class="main-header">
        <h2>Congrats, <span id="name-html">nnnnnn!</span>!</h2>
        <h3>Youre ticket is ready.</h3>
        <p>
          We've emailed your ticket to<br>
          <span id="email-html">john.doe@example.com </span> and will send
          updates in the run up to the event.
        </p>
      </div>

      <!-- **********  ticket  ********* -->
      <div class="ticket-container">
        <div class="ticket">
          <!-- ********* ticket header ********* -->
          <div class="ticket-header">
            <img src="../assets/images/logo-mark.svg" alt="logo-mark" />
            <div class="ticket-header-text">
              <h3>Coding Conf</h3>
              <p>date</p>
            </div>
          </div>

          <!-- ********* ticket body ********* -->
          <div class="ticket-body">
            <img src="../assets/images/avatar.png" alt="avatar" />
            <div class="ticket-body-text">
              <h3 id="name-html">nnnnnn</h3>
              <p id="github-html">john.doe@example.com</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../Js/app.js"></script>
  </body>
</html>
